<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Import Google Font Outfit -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;display=swap');
    </style>
    
    <!-- Glow filter for background nodes -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <!-- Fire Gradient for PH logo -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>

    <!-- Active signal line gradient -->
    <linearGradient id="activeLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD00FF" />
      <stop offset="100%" stop-color="#05A093" />
    </linearGradient>
  </defs>

  <style>
    .bg {
      fill: #000000;
    }
    
    /* Global Typography styles */
    .text-base {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      dominant-baseline: middle;
    }

    .letter-brand {
      font-weight: 800;
      font-size: 58px;
      fill: url(#fireGrad);
      text-anchor: middle;
    }

    .rest-p {
      animation: animAulo 9s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
      fill: #FF6B6B;
      text-anchor: start;
      font-weight: 600;
      font-size: 48px;
      transform-box: fill-box;
      transform-origin: left center;
    }

    .rest-h {
      animation: animEnrique 9s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
      fill: #FF6B6B;
      text-anchor: start;
      font-weight: 600;
      font-size: 48px;
      transform-box: fill-box;
      transform-origin: left center;
    }

    .text-tag {
      font-family: 'Outfit', -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #808090;
      text-anchor: middle;
    }

    .tag-highlight {
      fill: #FF7A00;
      font-weight: 800;
    }

    /* Background Animation details */
    .flow-line {
      stroke-dasharray: 4, 4;
      animation: flowDash 25s linear infinite;
    }
    .flow-line-active {
      stroke-dasharray: 6, 12;
      animation: flowDashActive 15s linear infinite;
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes flowDashActive {
      to { stroke-dashoffset: -100; }
    }

    .node-pulse-purple {
      animation: pulsePurple 3s infinite ease-in-out;
      fill: #BD00FF;
    }
    .node-pulse-teal {
      animation: pulseTeal 3s infinite ease-in-out;
      fill: #05A093;
    }
    @keyframes pulsePurple {
      0%, 100% { r: 5px; opacity: 0.6; }
      50% { r: 8px; opacity: 1; }
    }
    @keyframes pulseTeal {
      0%, 100% { r: 5px; opacity: 0.6; }
      50% { r: 8px; opacity: 1; }
    }

    /* Core animations: brand letters and structural flows */
    @keyframes animP {
      0%, 20% {
        transform: translate(375px, 150px);
      }
      45%, 65% {
        transform: translate(200px, 150px);
      }
      /* Parabolic Arc to merge back to center */
      76% {
        transform: translate(287px, 75px);
      }
      88%, 100% {
        transform: translate(375px, 150px);
      }
    }

    @keyframes animH {
      0%, 20% {
        transform: translate(425px, 150px);
      }
      45%, 65% {
        transform: translate(435px, 150px);
      }
      /* Parabolic Arc to merge back to center */
      76% {
        transform: translate(430px, 75px);
      }
      88%, 100% {
        transform: translate(425px, 150px);
      }
    }

    /* Reveal, Blur focus and wave transitions */
    @keyframes animAulo {
      0%, 22% {
        opacity: 0;
        transform: translate(360px, 150px) scale(0.9);
        filter: blur(8px);
      }
      45% {
        opacity: 1;
        transform: translate(232px, 150px) scale(1);
        fill: #FF6B6B;
        filter: blur(0px);
      }
      /* Left-to-right Wave Peak on "Paulo" */
      51% {
        transform: translate(232px, 150px) scale(1.08);
        fill: #ffffff;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.6));
      }
      58%, 65% {
        opacity: 1;
        transform: translate(232px, 150px) scale(1);
        fill: #FF6B6B;
        filter: blur(0px);
      }
      73%, 100% {
        opacity: 0;
        transform: translate(232px, 185px) scale(0.9);
        filter: blur(8px);
      }
    }

    @keyframes animEnrique {
      0%, 22% {
        opacity: 0;
        transform: translate(410px, 150px) scale(0.9);
        filter: blur(8px);
      }
      45% {
        opacity: 1;
        transform: translate(468px, 150px) scale(1);
        fill: #FF6B6B;
        filter: blur(0px);
      }
      53% {
        transform: translate(468px, 150px) scale(1);
        fill: #FF6B6B;
      }
      /* Left-to-right Wave Peak on "Henrique" */
      59% {
        transform: translate(468px, 150px) scale(1.08);
        fill: #ffffff;
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.6));
      }
      65% {
        opacity: 1;
        transform: translate(468px, 150px) scale(1);
        fill: #FF6B6B;
        filter: blur(0px);
      }
      73%, 100% {
        opacity: 0;
        transform: translate(468px, 185px) scale(0.9);
        filter: blur(8px);
      }
    }

    @keyframes animSub {
      0%, 45% {
        opacity: 0;
        transform: translate(400px, 245px) translateY(15px);
      }
      55%, 62% {
        opacity: 1;
        transform: translate(400px, 245px) translateY(0);
      }
      70%, 100% {
        opacity: 0;
        transform: translate(400px, 255px) translateY(0);
      }
    }

    @keyframes animLine {
      0%, 42% {
        transform: scaleX(0);
        opacity: 0;
      }
      52%, 62% {
        transform: scaleX(1);
        opacity: 0.3;
      }
      70%, 100% {
        transform: scaleX(0);
        opacity: 0;
      }
    }

    .brand-p {
      animation: animP 9s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    }

    .brand-h {
      animation: animH 9s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    }

    .separator-line {
      stroke: url(#fireGrad);
      stroke-width: 1.5;
      transform-origin: 400px 205px;
      animation: animLine 9s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    }

    .subtitle {
      animation: animSub 9s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: 400px 245px;
    }
  </style>

  <!-- Background Base -->
  <rect width="800" height="300" class="bg" />

  <!-- Neural connections in background (low opacity, tech theme) -->
  <g opacity="0.2">
    <!-- Left side connection graph -->
    <path d="M-20,150 L80,80 L120,160 L70,220 L-20,150 Z" fill="none" stroke="#BD00FF" stroke-width="1" class="flow-line" />
    <path d="M120,160 L200,120 M80,80 L200,120" fill="none" stroke="#05A093" stroke-width="1.5" class="flow-line-active" />
    <circle cx="80" cy="80" r="4" fill="#05A093" />
    <circle cx="120" cy="160" r="6" class="node-pulse-purple" filter="url(#glowBlur)" />
    <circle cx="70" cy="220" r="4" fill="#BD00FF" />
    <circle cx="200" cy="120" r="3" fill="#05A093" />

    <!-- Right side connection graph -->
    <path d="M820,150 L720,80 L680,160 L730,220 L820,150 Z" fill="none" stroke="#05A093" stroke-width="1" class="flow-line" />
    <path d="M680,160 L600,200 M720,80 L600,200" fill="none" stroke="#BD00FF" stroke-width="1.5" class="flow-line-active" />
    <circle cx="720" cy="80" r="4" fill="#BD00FF" />
    <circle cx="680" cy="160" r="6" class="node-pulse-teal" filter="url(#glowBlur)" />
    <circle cx="730" cy="220" r="4" fill="#05A093" />
    <circle cx="600" cy="200" r="3" fill="#BD00FF" />
  </g>

  <!-- BRAND LETTERS (P e H) -->
  <text class="text-base letter-brand brand-p">P</text>
  <text class="text-base letter-brand brand-h">H</text>

  <!-- COMPLEMENTARY WORDS (aulo / enrique) -->
  <!-- "Paulo" -> P + aulo -->
  <text class="text-base rest-p">aulo</text>

  <!-- "Henrique" -> H + enrique -->
  <text class="text-base rest-h">enrique</text>

  <!-- Separator Line and Subtitle -->
  <line x1="150" y1="205" x2="650" y2="205" class="separator-line" />
  <text class="text-tag subtitle">
    WEB DEVELOPER   |   UI/UX DESIGNER   |   <tspan class="tag-highlight">AI AUTOMATION &amp; AGENTS</tspan>
  </text>
</svg>
