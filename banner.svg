<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Import Google Font Outfit -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;display=swap');
    </style>
    
    <!-- Fire Gradient for PH -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E2E" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>
  </defs>

  <style>
    .bg {
      fill: #000000;
    }
    
    .text-base {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .letter-brand {
      font-weight: 800;
      font-size: 56px;
      fill: url(#fireGrad);
    }

    .letter-comp {
      font-weight: 600;
      font-size: 48px;
      fill: #FF6B6B;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: animateLetter 9s infinite alternate ease-in-out;
    }

    .text-tag {
      font-family: 'Outfit', -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #808090;
      text-anchor: middle;
    }

    .tag-highlight {
      fill: #FF7A00;
      font-weight: 800;
    }

    /* Keyframe Animations */
    @keyframes animP {
      0%, 25% {
        transform: translate(375px, 150px);
      }
      50%, 62% {
        transform: translate(200px, 150px);
      }
      /* Trajetória em Arco (curva de 90° para cima e volta ao centro) */
      70% {
        transform: translate(250px, 95px);
      }
      78% {
        transform: translate(320px, 110px);
      }
      88%, 100% {
        transform: translate(375px, 150px);
      }
    }

    @keyframes animH {
      0%, 25% {
        transform: translate(425px, 150px);
      }
      50%, 62% {
        transform: translate(435px, 150px);
      }
      /* Trajetória em Arco (curva de -90° para cima e volta ao centro) */
      70% {
        transform: translate(432px, 95px);
      }
      78% {
        transform: translate(428px, 110px);
      }
      88%, 100% {
        transform: translate(425px, 150px);
      }
    }

    @keyframes animateLetter {
      0%, 25% {
        opacity: 0;
        transform: translateY(15px) scale(0.7);
        fill: #FF6B6B;
      }
      /* Escrita e Entrada */
      35%, 45% {
        opacity: 1;
        transform: translateY(0) scale(1);
        fill: #FF6B6B;
      }
      /* Efeito Wave (Ondulação) */
      50% {
        transform: scale(1.25);
        fill: #ffffff;
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
      }
      55%, 62% {
        opacity: 1;
        transform: translateY(0) scale(1);
        fill: #FF6B6B;
      }
      /* Sumindo para baixo */
      72%, 100% {
        opacity: 0;
        transform: translateY(25px) scale(0.6);
      }
    }

    @keyframes animSub {
      0%, 45% {
        opacity: 0;
        transform: translate(400px, 245px) translateY(12px);
      }
      55%, 62% {
        opacity: 1;
        transform: translate(400px, 245px) translateY(0);
      }
      70%, 100% {
        opacity: 0;
        transform: translate(400px, 255px) translateY(0);
      }
    }

    @keyframes animLine {
      0%, 42% {
        transform: scaleX(0);
        opacity: 0;
      }
      52%, 62% {
        transform: scaleX(1);
        opacity: 0.3;
      }
      70%, 100% {
        transform: scaleX(0);
        opacity: 0;
      }
    }

    .brand-p {
      animation: animP 9s infinite alternate ease-in-out;
    }

    .brand-h {
      animation: animH 9s infinite alternate ease-in-out;
    }

    .separator-line {
      stroke: url(#fireGrad);
      stroke-width: 1.5;
      transform-origin: 400px 205px;
      animation: animLine 9s infinite alternate ease-in-out;
    }

    .subtitle {
      animation: animSub 9s infinite alternate ease-in-out;
      transform-origin: 400px 245px;
    }
  </style>

  <!-- Background Preto Puro -->
  <rect width="800" height="300" class="bg" />

  <!-- BRAND LETTERS (P e H) -->
  <text class="text-base letter-brand brand-p">P</text>
  <text class="text-base letter-brand brand-h">H</text>

  <!-- COMPLEMENTARY LETTERS (aulo / enrique) -->
  <!-- "Paulo" (P + aulo) -->
  <text x="235" y="150" class="text-base letter-comp" style="animation-delay: 0.1s">a</text>
  <text x="263" y="150" class="text-base letter-comp" style="animation-delay: 0.2s">u</text>
  <text x="287" y="150" class="text-base letter-comp" style="animation-delay: 0.3s">l</text>
  <text x="309" y="150" class="text-base letter-comp" style="animation-delay: 0.4s">o</text>

  <!-- "Henrique" (H + enrique) -->
  <text x="470" y="150" class="text-base letter-comp" style="animation-delay: 0.5s">e</text>
  <text x="498" y="150" class="text-base letter-comp" style="animation-delay: 0.6s">n</text>
  <text x="522" y="150" class="text-base letter-comp" style="animation-delay: 0.7s">r</text>
  <text x="538" y="150" class="text-base letter-comp" style="animation-delay: 0.8s">i</text>
  <text x="556" y="150" class="text-base letter-comp" style="animation-delay: 0.9s">q</text>
  <text x="584" y="150" class="text-base letter-comp" style="animation-delay: 1.0s">u</text>
  <text x="612" y="150" class="text-base letter-comp" style="animation-delay: 1.1s">e</text>

  <!-- Linha divisória e Subtítulo -->
  <line x1="150" y1="205" x2="650" y2="205" class="separator-line" />
  <text class="text-tag subtitle">
    WEB DEVELOPER   |   UI/UX DESIGNER   |   <tspan class="tag-highlight">AI AUTOMATION &amp; AGENTS</tspan>
  </text>
</svg>
